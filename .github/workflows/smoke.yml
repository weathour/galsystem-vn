name: Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.2
      GODOT_STATUS: stable
      GODOT_BIN: /tmp/godot/Godot_v4.6.2-stable_linux.x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            unzip \
            python3 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1

      - name: Install Godot
        run: |
          mkdir -p /tmp/godot
          curl -L --retry 5 --retry-delay 5 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Python tool checks
        run: |
          python3 tools/import_nscripter_case.py --self-test
          python3 tools/build_narcissu_manifest.py --self-test
          python3 tools/lint_galscript.py scenario
          python3 tools/lint_galscript.py --self-test

      - name: Godot import pass
        run: |
          "${GODOT_BIN}" --headless --import --path .

      - name: Godot runtime smokes
        run: |
          "${GODOT_BIN}" --headless --path . --quit-after 3
          "${GODOT_BIN}" --headless --path . --quit-after 120 -- --galsystem-smoke
          "${GODOT_BIN}" --headless --path . --quit-after 120 -- --galsystem-dm-smoke
          "${GODOT_BIN}" --headless --path . --quit-after 120 -- --galsystem-narcissu-private-smoke
          "${GODOT_BIN}" --headless --path . --quit-after 120 -- --galsystem-narcissu-local-smoke
          "${GODOT_BIN}" --headless --path . --quit-after 120 -- --galsystem-qa-invalid-save
          "${GODOT_BIN}" --headless --user-data-dir /tmp/galsystem-public-title-user --path . --quit-after 120 -- --galsystem-public-title-smoke
          "${GODOT_BIN}" --headless --path . --quit-after 120 -- --galsystem-screenshot-smoke
